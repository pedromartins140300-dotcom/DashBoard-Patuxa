<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATUXA — Painel do Gestor</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E6;--pr:#05A896;--dk:#065F52;--lt:#E3F4F1;--ac:#E8844F;--acl:#FDEEE2;--br:#B07D58;--tx:#1F2937;--mu:#6B7280;--bd:#E8E2D5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Plus Jakarta Sans',Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.nums{display:flex;flex-wrap:wrap;gap:6px}.nums span{min-width:34px;text-align:center;border-radius:10px;padding:5px 8px;background:var(--lt);color:var(--dk);font-weight:600;font-size:13px}
.nums .md{background:var(--ac);color:#fff}.nums .mo{outline:2px solid var(--pr);outline-offset:-2px;background:#fff}
.lg2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:10px}.lg2 i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.cd{background:var(--lt);color:var(--dk);border-radius:6px;padding:2px 8px;font-weight:600}
.stp{margin:0;padding-left:20px}.stp li{margin-bottom:10px;line-height:1.55}.stp code{background:var(--lt);color:var(--dk);border-radius:6px;padding:1px 6px;font-weight:600}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.w{max-width:1200px;margin:auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--dk)}.lg{width:40px;height:40px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center}
.hr{display:flex;align-items:center;gap:10px}.hr small{display:block;color:var(--mu);font-size:12px}.av{width:36px;height:36px;border-radius:50%;background:var(--lt);color:var(--dk);font-weight:700;display:grid;place-items:center}
.ib{background:none;border:0;padding:8px;border-radius:50%;cursor:pointer;position:relative;transition:.15s}.ib:hover{background:#fff}.cnt{position:absolute;top:0;right:0;background:var(--ac);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.pill{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:8px 18px;font-weight:600;cursor:pointer;transition:.15s}.pill.on{background:var(--pr);border-color:var(--pr);color:#fff}
.sub .pill{padding:6px 14px;font-size:13px;background:transparent;color:var(--dk);border-color:var(--pr)}.sub .pill.on{background:var(--pr);color:#fff}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(6,95,82,.06);animation:up .35s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card h2{margin:0 0 12px;font-size:16px;color:var(--dk)}.g{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}
@media(max-width:800px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.kp{transition:.2s}.kp:hover{transform:translateY(-2px)}.ki{width:40px;height:40px;border-radius:12px;background:var(--lt);color:var(--pr);display:grid;place-items:center}
.big{font-size:30px;font-weight:800;color:var(--dk)}.mu{color:var(--mu)}.up{color:#059669}.dn{color:var(--ac)}.v{font-size:12px;font-weight:600}
.bar{transform-box:fill-box;transform-origin:bottom;animation:gr .6s both}@keyframes gr{from{transform:scaleY(0)}}
.row{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 20px rgba(6,95,82,.06);cursor:pointer;transition:.15s}.row:hover{box-shadow:0 6px 24px rgba(6,95,82,.14)}
.fl{display:flex;align-items:center;gap:12px}.em{width:44px;height:44px;border-radius:50%;background:var(--lt);display:grid;place-items:center;font-size:22px}
.bd{border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;background:var(--lt);color:var(--dk)}.b1{background:#CDEBE6}.b2{background:#B8E3DC}.b3{background:var(--pr);color:#fff}.b0{background:#F3F4F6;color:var(--mu)}
.pg{height:6px;background:var(--lt);border-radius:9px;flex:1}.pg b{display:block;height:100%;border-radius:9px;background:var(--pr);transition:width .5s}.pg.late b{background:var(--ac)}
.al{background:var(--acl);border-radius:12px;padding:10px 12px;margin-bottom:8px}.al.ok{background:var(--lt)}
.tb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tb input,.fb select,.fb input,dialog input,dialog select{border:1px solid var(--bd);border-radius:12px;padding:9px 12px;background:#fff;min-width:0}.tb input{flex:1;min-width:180px}
.pb{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.15s}.pb:hover{background:var(--dk)}
.ol{background:#fff;color:var(--pr);border:1.5px solid var(--pr);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer}.ol:hover{background:var(--lt)}.ol.or{color:var(--ac);border-color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{background:var(--lt);color:var(--dk);text-align:left;padding:10px 12px;font-size:13px;white-space:nowrap}th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
th.s{cursor:pointer}td{padding:11px 12px;border-bottom:1px solid var(--bd)}tr.c{cursor:pointer}tr.late{background:var(--acl)}tr.late .rl{color:var(--ac);font-weight:800}
.chip{display:inline-block;background:var(--lt);color:var(--dk);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.sw{width:40px;height:22px;border-radius:99px;border:0;background:#D1D5DB;position:relative;cursor:pointer;transition:.2s}.sw.on{background:var(--pr)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{left:21px}
.fb{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fb label,dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}@media(max-width:800px){.sum{grid-template-columns:1fr 1fr}}
.sum div{background:#fff;border-radius:16px;padding:14px}.sum b{display:block;font-size:22px;color:var(--dk)}
.hb{display:flex;align-items:center;gap:8px;margin:8px 0}.hb span{width:120px;font-size:13px}.hb i{flex:1;height:12px;background:var(--lt);border-radius:9px}.hb b{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .6s}
.emp{text-align:center;padding:36px;color:var(--mu)}.emp div{font-size:42px}
dialog{border:0;border-radius:20px;padding:24px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(31,41,55,.4)}dialog h3{margin:0 0 14px;color:var(--dk)}dialog label{margin-bottom:10px}dialog small{color:var(--ac);min-height:14px}
.ra{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.pv{background:var(--lt);border-radius:12px;padding:10px;color:var(--dk);font-weight:600}
.sh{position:fixed;inset:0;background:rgba(31,41,55,.4);z-index:5;display:flex;justify-content:flex-end}.sh>div{background:#fff;width:min(400px,100%);padding:24px;overflow:auto;animation:sl .2s}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.dl div{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding:7px 0}
#tip{position:fixed;display:none;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--dk);box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;z-index:9}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:10}
.sk{height:110px;border-radius:20px;background:linear-gradient(90deg,#fff 25%,#EFE9DB 50%,#fff 75%);background-size:200% 100%;animation:sk 1.1s infinite}@keyframes sk{to{background-position:-200% 0}}
.ex{background:#FBF9F4;padding:12px 20px}.st{color:var(--ac)}.pr{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="estatistica_java.js"></script></head><body>
<div class="w"><header><div class="logo"><span class="lg" id="lgi"></span>PATUXA</div><div class="hr"><div style="text-align:right"><b>Gestor</b><small>Painel administrativo</small></div><span class="av">G</span><button class="ib" aria-label="Notificações (3)" id="bell"></button><button class="ib" aria-label="Sair" id="out" onclick="toast('Sessão encerrada (demo)')"></button></div></header><main id="app"></main></div>
<dialog id="dlg"></dialog><div id="tip"></div><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),P={paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',ux:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/>',star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',ed:'<path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',tr:'<path d="M3 6h18M19 6l-1 14H6L5 6M8 6V4h8v2"/>'};
const ic=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
$('lgi').innerHTML=ic('paw',22);$('bell').innerHTML=ic('bell')+'<span class="cnt">3</span>';$('out').innerHTML=ic('out');
const n1=x=>x.toLocaleString('pt-BR',{minimumFractionDigits:1}),brl=x=>x.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let servicos=[{nome:'Banho',dur:40,f:[.8,1,1.3],preco:50},{nome:'Tosa Higiênica',dur:20,f:[.8,1,1.3],preco:35},{nome:'Tosa na Máquina',dur:50,f:[.8,1,1.3],preco:70},{nome:'Hidratação',dur:25,f:[.8,1,1.3],preco:40}];
let profs=[{nome:'Ana',email:'ana@patuxa.com',esp:['Banho','Tosa Higiênica','Hidratação'],ativo:1,busy:1,hoje:9,nota:4.8},{nome:'Carlos',email:'carlos@patuxa.com',esp:['Tosa na Máquina','Banho'],ativo:1,busy:1,hoje:7,nota:4.6},{nome:'Marina',email:'marina@patuxa.com',esp:['Hidratação','Banho'],ativo:1,busy:0,hoje:6,nota:4.7}];
let tutores=[{nome:'Carla Souza',cpf:'123.456.789-01',tel:'(47) 99912-3456',email:'carla@email.com',end:[{rua:'Rua das Flores',num:'120',cep:'88301-100',cid:'Itajaí'}],pets:[{n:'Rex',e:'cachorro',p:'G',pel:'Curta'}]},{nome:'João Pedro',cpf:'987.654.321-00',tel:'(47) 99801-2233',email:'joao@email.com',end:[{rua:'Av. Brasil',num:'45',cep:'88303-200',cid:'Itajaí'},{rua:'Rua XV',num:'890',cep:'88010-000',cid:'Balneário Camboriú'}],pets:[{n:'Mel',e:'cachorro',p:'P',pel:'Longa'},{n:'Bidu',e:'cachorro',p:'M',pel:'Curta'}]},{nome:'Bia Torres',cpf:'456.123.789-55',tel:'(47) 99644-1020',email:'bia@email.com',end:[{rua:'Rua Lauro Müller',num:'33',cep:'88302-050',cid:'Itajaí'}],pets:[{n:'Luna',e:'gato',p:'P',pel:'Longa'}]}];
let Q=[['Rex','cachorro','Carla Souza','(47) 99912-3456','G','Curta',['Banho'],null,'aguardando','09:50',null,8],['Mel','cachorro','João Pedro','(47) 99801-2233','P','Longa',['Tosa Higiênica'],'Ana','banho','09:20','09:30',14],['Thor','cachorro','Marcos Lima','(47) 99755-8899','G','Dupla',['Banho','Tosa na Máquina'],'Carlos','secagem','08:40','08:50',135],['Luna','gato','Bia Torres','(47) 99644-1020','P','Longa',['Hidratação'],'Marina','pronto','09:00','09:05',17],['Nina','cachorro','Paulo Reis','(47) 99533-7744','M','Curta',['Tosa na Máquina'],null,'aguardando','10:05',null,4]].map((a,i)=>({id:i,pet:a[0],esp:a[1],tutor:a[2],tel:a[3],porte:a[4],pel:a[5],sv:a[6],prof:a[7],st:a[8],ent:a[9],ini:a[10],dec:a[11]}));
const H=[['Bidu','Banho','Ana','07:40','08:25',40,45,'Concluído','M',0,5,'Ficou lindo, super cheiroso!'],['Amora','Tosa na Máquina','Carlos','08:00','08:55',50,55,'Concluído','M',0,4,'Gostei muito do resultado.'],['Pandora','Hidratação','Marina','08:10','08:35',25,25,'Concluído','M',0,5,'Atendimento impecável.'],['Zeca','Banho','Marina','08:20','09:20',40,60,'Concluído','M',0,3,'Demorou mais que o previsto.'],['Fred','Tosa Higiênica','Ana','08:35','08:57',20,22,'Concluído','M',0,5,'Rápido e cuidadoso.'],['Mimi','Banho','Ana','08:50',null,40,null,'Desistência','M',0],['Thor','Banho + Tosa na Máquina','Carlos','08:50',null,117,null,'Em andamento','G',0],['Toby','Banho','Carlos','14:00','14:38',40,38,'Concluído','M',1,5,'Amamos!'],['Lola','Tosa na Máquina','Ana','10:00','10:48',40,48,'Concluído','P',1,4,'Ótimo atendimento.'],['Max','Hidratação','Marina','15:10','15:40',33,30,'Concluído','G',2,4,'Pelo macio, voltaremos.'],['Bella','Banho','Carlos','09:00','09:52',52,50,'Concluído','G',3,5,'Perfeito!'],['Kiko','Tosa Higiênica','Marina','11:00','11:30',20,30,'Concluído','M',5,2,'Tosa ficou irregular.'],['Nala','Banho','Ana','16:00','16:32',32,32,'Concluído','P',12,5,'Nota dez.'],['Zeus','Tosa na Máquina','Carlos','08:30','09:40',65,70,'Concluído','G',20,4,'Muito bom.']].map((a,i)=>({id:i,pet:a[0],serv:a[1],prof:a[2],ent:a[3],fim:a[4],est:a[5],real:a[6],st:a[7],porte:a[8],d:a[9],nota:a[10],com:a[11]}));
const KP={Hoje:[['42 min',-3],['28',12],['4,8%',.6],['4,7 ★',.1]],Semana:[['44 min',-1],['176',8],['5,1%',-.3],['4,6 ★',0]],'Mês':[['43 min',-2],['742',5],['4,9%',.2],['4,7 ★',.1]]};
const S={aba:0,sub:0,per:'Hoje',q:'',sel:null,exp:{},load:1,h:{serv:'',st:'',per:'30',porte:'',prof:'',de:'',ate:'',k:'ent',dir:1,pg:0}};
const est=(porte,sv)=>Math.round(sv.reduce((t,x)=>{const s=servicos.find(y=>y.nome==x);return t+(s?s.dur*s.f[{P:0,M:1,G:2}[porte]]:0)},0));
const dia=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10);
// gráficos
const bars=(d,hi)=>{const W=400,Ht=210,m=Math.max(...d.map(x=>x[1])),w=W/d.length;return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img">`+d.map((x,i)=>{const h=x[1]/m*150,px=i*w+w*.18,bw=w*.64,c=hi&&x[1]==m?'#E8844F':'#05A896';return `<g data-tip="${x[0]}: ${x[1]} atendimentos"><rect class="bar" x="${px}" y="${Ht-30-h}" width="${bw}" height="${h}" rx="8" fill="${c}" style="animation-delay:${i*60}ms"/><text x="${px+bw/2}" y="${Ht-36-h}" text-anchor="middle" font-weight="700" fill="#065F52">${x[1]}</text><text x="${px+bw/2}" y="${Ht-10}" text-anchor="middle" fill="#6B7280" font-size="12">${x[0]}</text></g>`}).join('')+'</svg>'};
const line=d=>{const W=400,Ht=200,m=Math.max(...d.map(x=>x[1])),p=d.map((x,i)=>[30+i*(W-60)/(d.length-1),Ht-40-x[1]/m*120]);return `<svg viewBox="0 0 ${W} ${Ht}" width="100%"><polyline fill="none" stroke="#05A896" stroke-width="3" points="${p.map(a=>a.join(',')).join(' ')}"/>`+p.map((a,i)=>`<g data-tip="${d[i][0]}: ${d[i][1]} atendimentos"><circle cx="${a[0]}" cy="${a[1]}" r="5" fill="#fff" stroke="#05A896" stroke-width="3"/><text x="${a[0]}" y="${a[1]-10}" text-anchor="middle" fill="#065F52" font-weight="700" font-size="11">${d[i][1]}</text><text x="${a[0]}" y="${Ht-10}" text-anchor="middle" fill="#6B7280" font-size="11">${d[i][0]}</text></g>`).join('')+'</svg>'};
const hb=d=>{const m=Math.max(1,...d.map(x=>x[1]));return d.map(x=>`<div class="hb"><span>${x[0]}</span><i><b style="width:${x[1]/m*100}%"></b></i><b style="background:none;width:24px;color:#065F52">${x[1]}</b></div>`).join('')};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const bdg=s=>`<span class="bd ${{aguardando:'',banho:'b1',secagem:'b2',pronto:'b3'}[s]??'b0'}">${s[0].toUpperCase()+s.slice(1)}</span>`;
// visão geral
function vg(){if(S.load)return '<div class="g g4">'+'<div class="sk"></div>'.repeat(4)+'</div><div class="g g2"><div class="sk" style="height:260px"></div><div class="sk" style="height:260px"></div></div>';
const k=KP[S.per],lab=['Tempo médio de atendimento','Atendimentos do dia','Taxa de desistência','Satisfação média'],ics=['clock','act','ux','star'],menor=[1,0,1,0],ref=S.per=='Hoje'?'ontem':'período anterior';
const wait=Q.filter(a=>a.st=='aguardando').length,late=Q.filter(a=>a.dec>est(a.porte,a.sv));
return `<div class="tb">${['Hoje','Semana','Mês'].map(p=>`<button class="pill ${S.per==p?'on':''}" onclick="S.per='${p}';render()">${p}</button>`).join('')}</div>
<div class="g g4">${k.map((x,i)=>{const bom=menor[i]?x[1]<=0:x[1]>=0;return `<div class="card kp"><div class="ki">${ic(ics[i])}</div><div class="mu" style="margin-top:10px">${lab[i]}</div><div class="big">${x[0]}</div><div class="v ${bom?'up':'dn'}">${x[1]>=0?'▲':'▼'} ${Math.abs(x[1]).toLocaleString('pt-BR')}${i==2?' p.p.':i==1?'%':''} vs. ${ref}</div></div>`}).join('')}</div>
<div class="g g2"><div class="card"><h2>Horários de pico (atendimentos)</h2>${bars([['8h',4],['9h',7],['10h',9],['11h',6],['14h',8],['15h',5]],1)}</div><div class="card"><h2>Produtividade por profissional (hoje)</h2>${bars([['Ana',9],['Carlos',7],['Marina',6]])}</div></div>

function form(t,fs,v,save,pv){const d=$('dlg');d.innerHTML=`<form id="fm" novalidate><h3>${t}</h3>`+fs.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${v[f.k]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" step="any" value="${v[f.k]??''}">`}<small id="e_${f.k}"></small></label>`).join('')+(pv?'<div id="pv" class="pv"></div>':'')+`<div class="ra"><button type="button" class="ol" onclick="dlg.close()">Cancelar</button><button class="pb">Salvar</button></div></form>`;const fm=$('fm'),up=()=>{if(pv)$('pv').innerHTML=pv(Object.fromEntries(new FormData(fm)))};fm.oninput=up;up();

function csv(){const r=flt(),l=[['Pet','Serviço','Profissional','Entrada','Conclusão','Tempo estimado (min)','Tempo real (min)','Status'],...r.map(x=>[x.pet,x.serv,x.prof,x.ent,x.fim||'',x.est,x.real??'',x.st])].map(a=>a.map(c=>`"${c}"`).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l],{type:'text/csv'}));a.download='patuxa-historico.csv';a.click();toast('CSV exportado ('+r.length+' linhas)')}
function det(i){const r=H[i],sv=r.serv.split(' + ');info(`<h3>${r.pet} · ${r.st}</h3><div class="dl"><div><span class="mu">Serviços executados</span><b>${sv.join(', ')}</b></div><div><span class="mu">Profissional</span><b>${r.prof}</b></div><div><span class="mu">Entrada → Conclusão</span><b>${r.ent} → ${r.fim||'—'}</b></div></div><h4 style="color:var(--dk)">Avaliação do tutor</h4>${r.nota?`<div style="color:#E8844F;font-size:20px" aria-label="${r.nota} de 5">${stars(r.nota)}</div><p>“${r.com}”</p>`:'<p class="mu">Sem avaliação.</p>'}`)}
function hist(){const f=S.h,all=flt(),pgs=Math.max(1,Math.ceil(all.length/6));if(f.pg>=pgs)f.pg=pgs-1;const rows=all.slice(f.pg*6,f.pg*6+6),done=all.filter(r=>r.st=='Concluído'),ok=done.filter(r=>r.real<=r.est).length,avg=k=>done.length?Math.round(done.reduce((t,r)=>t+r[k],0)/done.length):0,fat=all.filter(r=>r.st!='Desistência').reduce((t,r)=>t+r.serv.split(' + ').reduce((u,s)=>u+(servicos.find(y=>y.nome==s)||{preco:0}).preco,0),0);

<div class="sum"><div class="mu">Total de atendimentos<b>${all.length}</b></div><div class="mu">Dentro do prazo<b>${done.length?Math.round(ok/done.length*100):0}%</b></div><div class="mu">Tempo médio real vs. estimado<b>${avg('real')} / ${avg('est')} min</b></div><div class="mu">Faturamento do período<b>${brl(fat)}</b></div></div>
${all.length?`<div class="tw"><table><thead><tr>${th.map(([k,l])=>`<th class="s" onclick="srt('${k}')" aria-sort="${f.k==k?(f.dir>0?'ascending':'descending'):'none'}">${l} ${f.k==k?(f.dir>0?'▲':'▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{const lt=r.real>r.est;return `<tr class="c ${lt?'late':''}" tabindex="0" onkeydown="if(event.key=='Enter')det(${r.id})" onclick="det(${r.id})"><td><b>${r.pet}</b></td><td>${r.serv}</td><td>${r.prof}</td><td>${r.ent}</td><td>${r.fim||'—'}</td><td>${r.est} min</td><td class="rl">${r.real!=null?r.real+' min':'—'}</td><td><span class="bd ${r.st=='Concluído'?'':r.st=='Em andamento'?'b1':'b0'}">${r.st}</span></td></tr>`}).join('')}</tbody></table></div><div class="pr"><button class="ol" ${f.pg?'':'disabled'} onclick="S.h.pg--;render()">‹ Anterior</button><span class="mu">Página ${f.pg+1} de ${pgs}</span><button class="ol" ${f.pg<pgs-1?'':'disabled'} onclick="S.h.pg++;render()">Próxima ›</button></div>`:'<div class="emp"><div>🐾</div>Nenhum atendimento para esses filtros. Ajuste o período ou limpe os filtros.</div>'}</div>

<div class="card"><h2>Avaliações</h2><div class="g g2" style="margin:0"><div>${hb(dist)}</div><div>${all.filter(r=>r.com).slice(0,3).map(r=>`<div class="al ok"><span style="color:#E8844F">${stars(r.nota)}</span> <b>${r.pet}</b><div>“${r.com}”</div></div>`).join('')||'<div class="mu">Sem comentários.</div>'}</div></div></div>`}
// estatística — os números vêm do Java (Main → EstatisticaAtendimentos → ExportadorHTML → estatistica_java.js)
const EJ=window.ESTATISTICA_JAVA||null;
const n2=x=>x.toLocaleString('pt-BR',{maximumFractionDigits:2});
if(EJ&&Date.now()-EJ.geradoEmMs<120000)S.aba=3; // aberto pelo Java agora → já mostra a aba Estatística
function est2(){
if(!EJ)return `<div class="card emp"><div>☕</div><b style="color:var(--dk)">Nenhum resultado do Java ainda.</b><p>Deixe este HTML na mesma pasta dos arquivos .java e execute:</p><p><code class="cd">javac *.java</code> &nbsp; <code class="cd">java Main</code></p><p>O Java faz o cálculo, grava o arquivo <code class="cd">estatistica_java.js</code> e abre esta página com o resultado.</p></div>`;
const d=EJ.dados,o=EJ.ordenados,n=EJ.quantidade,me=EJ.media,md=EJ.mediana,mo=EJ.moda,m=Math.floor(n/2),par=n%2==0,mi=par?[m-1,m]:[m];
return `<div class="card" style="margin-bottom:16px"><div class="fl" style="flex-wrap:wrap"><div style="flex:1;min-width:220px"><h2 style="margin-bottom:4px">☕ Resultado calculado pelo Java</h2><div class="mu">Classe <b>EstatisticaAtendimentos</b> · gerado em ${EJ.geradoEm}. Para mudar os números, edite <b>Main.java</b> e execute de novo.</div></div><button class="ol" onclick="location.reload()">Recarregar</button></div>
<h2 style="margin:16px 0 8px;font-size:14px">Atendimentos por dia (ordem original)</h2><div class="nums">${d.map((v,i)=>`<span title="Dia ${i+1}">${v}</span>`).join('')}</div></div>
<div class="g g4">${[['act','Média',n2(me),'atendimentos por dia'],['clock','Mediana',n2(md),'valor central'],['star','Moda',mo.length?mo.join(' e '):'—',mo.length?`aparece ${EJ.frequenciaModa} vezes`+(mo.length>1?' (multimodal)':''):'nenhum valor se repete'],['paw','Total',EJ.total.toLocaleString('pt-BR'),n+' dias analisados']].map(x=>`<div class="card kp"><div class="ki">${ic(x[0])}</div><div class="mu" style="margin-top:10px">${x[1]}</div><div class="big">${x[2]}</div><div class="v mu">${x[3]}</div></div>`).join('')}</div>
<div class="g g2"><div class="card"><h2>Dados ordenados</h2><div class="nums">${o.map((v,i)=>`<span class="${mi.includes(i)?'md':mo.includes(v)?'mo':''}" title="${i+1}º valor">${v}</span>`).join('')}</div>
<div class="lg2"><span><i style="background:var(--ac)"></i>Posição da mediana</span>${mo.length?'<span><i style="border:2px solid var(--pr)"></i>Moda</span>':''}</div></div>
<div class="card"><h2>Como foi calculado</h2><ol class="stp">
<li><b>Média:</b> soma ÷ quantidade = <code>${EJ.total} ÷ ${n}</code> = <b>${n2(me)}</b></li>
<li><b>Mediana:</b> ordena os ${n} valores; ${par?`como ${n} é par, é a média do ${m}º e do ${m+1}º: <code>(${o[m-1]} + ${o[m]}) ÷ 2</code>`:`como ${n} é ímpar, é o ${m+1}º valor: <code>${o[m]}</code>`} = <b>${n2(md)}</b></li>
